.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script>
const S='#2b2a33',W=3.4;
const L=(d,x='')=>`<path d="${d}" fill="none" ${/(^| )stroke=/.test(x)?'':`stroke="${S}"`} ${x.includes('stroke-width')?'':`stroke-width="${W}"`} stroke-linecap="round" stroke-linejoin="round" ${x}/>`;
const P=(d,f,x='')=>`<path d="${d}" fill="${f}" stroke="${S}" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;

const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32e(bytes){let o='',v=0,n=0;for(const x of bytes){v=(v<<8)|x;n+=8;while(n>=5){o+=B32[(v>>>(n-5))&31];n-=5}v&=(1<<n)-1}if(n)o+=B32[(v<<(5-n))&31];return o}
function b32d(s){const out=[];let v=0,n=0;for(const ch of s){const i=B32.indexOf(ch);if(i<0)continue;v=(v<<5)|i;n+=5;if(n>=8){out.push((v>>>(n-8))&255);n-=8;v&=(1<<n)-1}}return new Uint8Array(out)}

 if(!b.dataset.ok){b.dataset.ok=1;b.textContent='本当に上書きする？もう一度タップで確定';b.style.background='#e5484d';setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.textContent='復元する';b.style.background=''}},4000);return}
 s.tasks.forEach(t=>{if(t.d>1)t.d=1});['done','log','cats'].forEach(k=>s[k]=s[k]||{});s.coins=s.coins||0;s.nid=s.nid||Math.max(0,...s.tasks.map(t=>t.id))+1;s.welcomed=1;
 st=s;save();closeM();tab='t';render();burst(30);float('復元できたよ！')}

const REF=[0,5,10,20];
const rc=c=>c.r===3?'r3':c.r===2?'r2':'';
const rbadge=c=>c.r===3?'<span class="rb">SUPER RARE</span>':c.r===2?'<span class="rb">RARE</span>':'';
const rtag=c=>c.r>1?`<span class="rtag ${rc(c)}">${c.r===3?'SUPER RARE':'RARE'}</span>`:'';
let bmsg='',bhop=0;
function greet(){const d=jst(),V=vis(d),dn=st.done[d]||[],left=V.filter(t=>!dn.includes(t.id)).length,s=streak(),r=x=>x[Math.floor(Math.random()*x.length)];
 if(!V.length)return r(['今日はタスクなし？ ぼくと昼寝する？','予定ゼロの日も大事。のびのびしよ','タスクを1個だけ入れてみる？ 見守ってるよ']);
 if(!left)return r(['全部おわってる！ 天才では？','今日はもうゴロゴロしていいよ','おつかれさま。ぼくのおなか、なでる？','完璧すぎて、しっぽが勝手に揺れてる']);
 const p=['今日もいっしょにがんばろ！',`あと${left}個！ ぼくは寝て待ってる`,'まずは1個だけ、やってみる？','終わったらおやつにしようね','やる気は、始めてから来るらしいよ','むずかしいのは後回しでいいよ。かんたんなのから！','ぼくは応援係。あなたは実行係。いいチームだね','2分だけやってみない？ ぼく、時計見てるから',`あと${left}個…ぼくも肉球で手伝いたい`];
 if(s>=2)p.push(`🔥${s}日連続！ この記録、守りたいね`);if(dn.length)p.push(`もう${dn.length}個できてる！ いい感じ`);return r(p)}
const CHEER=['えらい！','さすが！','その調子！','ナイス！ ぼくも鼻が高い','やるじゃん…！','ゴロゴロ…（うれしい音）','かっこいい…！','見てたよ、今の！','天才の動き！','ほめてつかわす（王様猫ふう）'];
function buddyCard(){const own=CATS.filter(c=>st.cats[c.id]);
 if(!own.length)return `<div class="card bud" style="border-style:dashed"><div style="font-size:34px">🐾</div><div class="sub" style="flex:1">ガチャでネコに出会うと、相棒になって応援してくれるよ</div></div>`;
 let c=CATS.find(x=>x.id===st.buddy&&st.cats[x.id]);if(!c){c=own[0];st.buddy=c.id;save()}
 if(!bmsg)bmsg=greet();
 return `<div class="card bud"><div class="bi ${rc(c)} ${bhop?'hop':''}" onclick="poke()">${c.svg}</div><div class="bub2"><small>相棒の${c.n}</small>${esc(bmsg)}</div></div>`}
function poke(){bmsg=greet();bhop=1;render();bhop=0}
function setBuddy(id){st.buddy=id;bmsg='よろしくね！ いっしょにがんばろ';save();closeM();tab='t';render();scrollTo(0,0)}
let lo={};
function leftovers(){const d=jst();return st.tasks.filter(t=>t.type==='o'&&t.date&&t.date<d&&!(st.done[t.date]||[]).includes(t.id))}
function checkLeft(){if(tab!=='t'||busy||!$('#ov').hidden||document.getElementById('cp'))return;const Ls=leftovers();if(!Ls.length)return;lo={};Ls.forEach(t=>lo[t.id]='k');
 modal(`<div class="big" style="width:110px">${CATS[0].svg}</div><h3>前の日にできなかったタスクがあるよ</h3><div class="sub">今日に持ち越すか、消すかを選んでね</div><div class="card p" style="text-align:left;margin-top:10px">${Ls.map(t=>`<div class="task" style="flex-wrap:wrap"><div class="tt"><b>${esc(t.t)}</b><div class="sub">${dl(t.date)}・${DIFF[t.d].n}</div></div><div class="chips" style="width:100%;margin:2px 0"><button class="chip sel" onclick="loSet(${t.id},'k',this)">➡ 今日に持ち越す</button><button class="chip" onclick="loSet(${t.id},'x',this)">🗑 消す</button></div></div>`).join('')}</div><button class="btn b" onclick="loDone()">決定</button>`,1)}
function loSet(id,v,b){lo[id]=v;[...b.parentNode.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function loDone(){const d=jst();let k=0;st.tasks=st.tasks.filter(t=>lo[t.id]!=='x');st.tasks.forEach(t=>{if(lo[t.id]==='k'){t.date=d;t.carry=1;k++}});lo={};save();closeM();render();float(k?'今日はいけるはず！':'スッキリ！')}
try{document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()})}catch(e){}
render();if(st.welcomed===0)welcome();else showNews();
</script></body></html>
